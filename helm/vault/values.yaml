image: hashicorp/vault:latest

# Fixed dev root token created by entrypoint.sh on first run. Consuming apps
# must be given this same value (e.g. spring-bill's vault.token) via their
# own values/CI overrides.
token: root

storage: 1Gi

service:
  # Fixed name (not derived from .Release.Name) so consuming apps in the same
  # namespace can reach Vault at a stable "vault:8200" regardless of what
  # release name this chart was installed under.
  name: vault
