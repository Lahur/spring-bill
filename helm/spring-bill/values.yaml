image:
  repository: docker-registry.registry.svc.cluster.local:5000/spring-bill
  tag: latest
  pullPolicy: Always

app:
  replicaCount: 1
  containerPort: 8080
  springProfile: prod
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi

service:
  type: NodePort
  port: 8080
  nodePort: 30081

vault:
  # Postgres and Vault are provisioned separately by k8s_pulumi/pulumi_hetzner
  # in the same namespace ("postgres"/"vault" Services, db "spring_bill").
  # serviceName/token must match that stack's Vault deployment.
  serviceName: vault
  token: root

bill:
  pos:
    path: /data/pos
    storage: 20Gi
  accountsStatement:
    path: /data/accounts-statement
    storage: 20Gi