image:
  repository: docker-registry.registry.svc.cluster.local:5000/spring-bill
  tag: latest
  pullPolicy: Always

app:
  replicaCount: 1
  containerPort: 8080
  springProfile: prod
  uid: 1000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi

service:
  type: ClusterIP
  port: 8080

ingress:
  # Requires ingress-nginx + cert-manager, provisioned by k8s_pulumi/pulumi_hetzner.
  enabled: true
  host: bill.tehnomodus.com
  # ingress-nginx defaults to 1m, which rejects the scanned bill/receipt PDFs the
  # mobile app uploads; keep this >= spring.servlet.multipart.max-*-size below.
  maxBodySize: 10m

vault:
  # Postgres and Vault are provisioned separately by k8s_pulumi/pulumi_hetzner
  # in the same namespace ("postgres"/"vault" Services, db "spring_bill").
  # serviceName/tokenSecret must match that stack's Vault deployment; the token is
  # generated there and stored in the "vault-token" Secret, never in this chart.
  serviceName: vault
  tokenSecret:
    name: vault-token
    key: token

bill:
  pos:
    path: /data/pos
    storage: 20Gi
  accountsStatement:
    path: /data/accounts-statement
    storage: 20Gi