image:
  repository: docker-registry.registry.svc.cluster.local:5000/spring-bill
  tag: latest
  pullPolicy: Always

app:
  replicaCount: 1
  containerPort: 8080
  springProfile: prod
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi

service:
  type: NodePort
  port: 8080
  nodePort: 30081

postgres:
  image: postgres:18.4
  db: spring_bill
  user: postgres
  password: postgres
  storage: 1Gi

vault:
  # Deployed separately by the helm/vault chart, shared across apps in the
  # namespace. serviceName must match that chart's service.name (default
  # "vault"), and token must match its fixed dev root token.
  serviceName: vault
  token: root