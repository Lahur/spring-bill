apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-vault
data:
  vault-config.hcl: |
    ui            = true
    disable_mlock = true

    storage "file" {
      path = "/vault/file"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }
  entrypoint.sh: |
    #!/bin/sh
    set -e

    export VAULT_ADDR="http://127.0.0.1:8200"
    KEYS_FILE="/vault/file/init.json"

    vault server -config=/vault/config/vault-config.hcl &
    VAULT_PID=$!
    trap 'kill -TERM $VAULT_PID' TERM INT

    while true; do
      status=0
      vault status >/dev/null 2>&1 || status=$?
      [ "$status" -eq 0 ] && break
      [ "$status" -eq 2 ] && break
      sleep 1
    done

    FIRST_RUN=0
    if [ ! -f "$KEYS_FILE" ]; then
      echo "Vault: first run, initializing..."
      vault operator init -key-shares=1 -key-threshold=1 -format=json > "$KEYS_FILE"
      FIRST_RUN=1
    fi

    UNSEAL_KEY=$(awk '/"unseal_keys_b64"/{getline; gsub(/[ \t",]/,""); print; exit}' "$KEYS_FILE")
    ROOT_TOKEN=$(awk '/"root_token"/{gsub(/[ \t",]/,""); sub(/root_token:/,""); print; exit}' "$KEYS_FILE")

    status=0
    vault status >/dev/null 2>&1 || status=$?
    if [ "$status" -eq 2 ]; then
      echo "Vault: unsealing..."
      vault operator unseal "$UNSEAL_KEY" >/dev/null
    fi

    if [ "$FIRST_RUN" -eq 1 ]; then
      echo "Vault: enabling kv-v2 secrets engine at secret/..."
      VAULT_TOKEN="$ROOT_TOKEN" vault secrets enable -path=secret -version=2 kv >/dev/null
      echo "Vault: creating fixed dev token '{{ .Values.vault.token }}'..."
      VAULT_TOKEN="$ROOT_TOKEN" vault token create -id={{ .Values.vault.token }} -policy=root >/dev/null
    fi

    echo "Vault: ready. Root token: $ROOT_TOKEN"

    wait $VAULT_PID