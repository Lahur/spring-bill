spring:
  config:
    import: "optional:vault://"
  application:
    name: spring-bill
  cloud:
    vault:
      uri: ${VAULT_ADDR}
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret

bill:
  schedule:
    sync-cron: "0 30 1 * * *"
    delete-cron: "0 0 1 1 * *"
    monthly-summary-cron: "0 0 2 1 * *"
    sync-lookback-weeks: 1
  path:
    pos: /data/pos
    accounts-statement: /data/accounts-statement

logging:
  level:
    hr.bill.spring_bill: DEBUG