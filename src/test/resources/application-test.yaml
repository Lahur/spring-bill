# Test-only values for the "test" profile, so integration tests don't depend on the local Vault
# dev server. Mirrors the property names Vault normally supplies (see vault/entrypoint.sh and
# application-dev.yaml). The bill.eposlovanje/pondi/f1-web/ais-eposlovanje/hub/mail-bill base-urls below are
# overridden at runtime by AbstractIntegrationTest's @DynamicPropertySource to point at the
# eposlovanje-mock/hub-bill/mail-bill-test containers. API keys live per tenant in tenant_api_key
# (seeded by AbstractIntegrationTest). bill.path.* and every bill.schedule.* cron below are read
# strictly (@Value / @Scheduled(cron = "${...}")), so they're required even though tests don't
# trigger the schedules.
spring:
  cloud:
    vault:
      enabled: false

bill:
  api-key-encryption-key: "dGVzdC1vbmx5LWFwaS1rZXktZW5jcnlwdGlvbi1rZXk="
  path:
    pos: "/tmp/spring-bill-test/pos"
    accounts-statement: "/tmp/spring-bill-test/accounts-statement"
  schedule:
    sync-cron: "0 30 1 * * *"
    delete-cron: "0 0 1 1 * *"
    monthly-summary-cron: "0 0 2 1 * *"
    bank-statement-cron: "0 0 3 * * *"
    sync-lookback-weeks: 156
  hub-url: "http://localhost:9"
  mail-bill:
    base-url: "http://localhost:9"
  eposlovanje:
    base-url: "http://localhost:9"
  f1-web:
    base-url: "http://localhost:9"
  pondi:
    base-url: "http://localhost:9"
  ais-eposlovanje:
    base-url: "http://localhost:9"
